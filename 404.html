<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-code {
      font-size: clamp(5rem, 12vw, 9rem);
      font-weight: 800;
      color: var(--accent-ocean);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <div class="container not-found-wrapper">
    <span class="not-found-code">404</span>
    <h1 class="hero-title" style="font-size: clamp(1.8rem, 3vw, 2.4rem); margin-bottom: 16px;">
      Страница не найдена
    </h1>
    <p class="hero-desc" style="margin-bottom: 32px;">
      Возможно, адрес был изменен или страница еще находится в разработке.
    </p>
    <a href="index.html" class="btn btn-primary">Вернуться на главную</a>
  </div>
</body>
</html>
